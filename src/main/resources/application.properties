# URL de conexao com o banco (vem da variavel de ambiente)
spring.datasource.url=${SPRING_DATASOURCE_URL}

# Usuario do banco (vem da variavel de ambiente)
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}

# Senha do banco (vem da variavel de ambiente)
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# O Hibernate cria somente o que ainda nao existe no banco
spring.jpa.hibernate.ddl-auto=update

# Mostra as consultas SQL no console
spring.jpa.show-sql=true
