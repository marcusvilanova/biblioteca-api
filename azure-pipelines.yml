# CI da API Biblioteca
# A cada push na main: prepara o Java, compila, roda os testes e guarda o JAR para o CD usar

trigger:
  branches:
    include:
    - main

pool:
  vmImage: ubuntu-latest

variables:
  versaoJava: "17"
  versaoJdk: "1.17"
  nomeArtefato: "app"
  tituloTestes: "Testes JUnit da Biblioteca"

steps:
- task: JavaToolInstaller@0
  displayName: "Configurar Java 17"
  inputs:
    jdkSourceOption: "PreInstalled"
    jdkArchitectureOption: "x64"
    versionSpec: $(versaoJava)

# Compila, roda os testes e manda o resultado deles para a aba Tests da execução
- task: Maven@4
  displayName: "Maven - Compilar e executar testes"
  inputs:
    goals: "clean package"
    mavenPomFile: "pom.xml"
    javaHomeOption: "JDKVersion"
    jdkVersionOption: $(versaoJdk)
    mavenVersionOption: "Default"
    publishJUnitResults: true
    testResultsFiles: "**/surefire-reports/TEST-*.xml"
    testRunTitle: $(tituloTestes)

# Separa só o JAR numa pasta própria
- task: CopyFiles@2
  displayName: "Preparar artefato JAR"
  inputs:
    Contents: "**/target/*.jar"
    SourceFolder: "$(System.DefaultWorkingDirectory)"
    TargetFolder: "$(Build.ArtifactStagingDirectory)/$(nomeArtefato)"

# É esse artefato que o CD vai baixar
- task: PublishPipelineArtifact@1
  displayName: "Publicar artefato app"
  inputs:
    publishLocation: "pipeline"
    artifact: "$(nomeArtefato)"
    targetPath: "$(Build.ArtifactStagingDirectory)/$(nomeArtefato)"